<title>ยายสมศรี</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: a chat with Grandma Somsri at home. Top: her living room in morning light, with her changing clothes and pose to match how you feel.
   Below: the chat, quick replies, and a text box. Warm single light look by design. */
:root {
  color-scheme: only light;
  --wall: #fbf1e2;
  --wall-2: #f4e2c9;
  --floor: #d9b48a;
  --paper: #ffffff;
  --cream: #fffaf2;
  --ink: #33251f;
  --ink-soft: #7b6a60;
  --ink-faint: #ad9e94;
  --line: #eadfd2;
  --accent: #c8643b;
  --honey: #e9b44c;
  --mood: #f6e1c8;
  --f: "Kanit", "Sukhumvit Set", "Noto Sans Thai", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--f); font-weight: 300; font-size: 16px; line-height: 1.55; overflow: hidden; }
[hidden] { display: none !important; }
/* Grandma's house is a warm, light room by design. Declaring how the page looks in dark mode
   (the same warm colours) stops browsers such as Samsung Internet from auto-darkening it. */
@media (prefers-color-scheme: dark) {
  :root { color-scheme: only light; }
  html, body { background: var(--cream); color: var(--ink); }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2.5px solid var(--honey); outline-offset: 2px; }

.stage { height: 100%; display: flex; justify-content: center; }
.app { width: 100%; max-width: 460px; height: 100%; display: flex; flex-direction: column; background: var(--cream); position: relative; overflow: hidden; }
@media (min-width: 620px) {
  body { background: #efe6da; }
  .stage { align-items: center; padding-block: 28px; }
  .app { height: min(860px, 100%); border-radius: 36px; box-shadow: 0 40px 80px -40px rgba(60, 35, 20, .45); }
}

/* Header */
.head { display: flex; align-items: center; gap: .7rem; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--cream); border-bottom: 1px solid var(--line); z-index: 2; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--mood); overflow: hidden; flex: none; display: grid; place-items: end center; transition: background .5s; }
.avatar svg { width: 46px; height: auto; margin-bottom: -26px; }
.who { flex: 1; min-width: 0; line-height: 1.25; }
.who b { font-weight: 500; font-size: 1.02rem; display: block; }
.who small { font-size: .78rem; color: var(--ink-soft); display: flex; align-items: center; gap: .35rem; }
.who small i { width: 7px; height: 7px; border-radius: 50%; background: #5cae78; }
.streak { font-size: .78rem; color: var(--ink-soft); background: #f4ebdf; border-radius: 999px; padding: .2rem .65rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.streak b { color: var(--ink); font-weight: 500; }

/* Living room */
.scene { position: relative; flex: none; height: clamp(210px, 34vh, 290px); overflow: hidden; background: linear-gradient(180deg, var(--wall) 0%, var(--wall-2) 100%); }
.scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: repeating-linear-gradient(90deg, #d4ab7f 0 58px, #cfa476 58px 60px), var(--floor); border-top: 3px solid #c39566; }
.window { position: absolute; top: 14%; right: 9%; width: 30%; max-width: 130px; aspect-ratio: 4 / 5; border-radius: 10px 10px 4px 4px; border: 5px solid #fff; box-shadow: 0 0 0 1.5px #d9c3a6, 0 0 60px 10px rgba(255, 220, 150, .55);
  background: radial-gradient(circle at 70% 30%, #fff6c9 0 12%, #ffe08f 13% 18%, transparent 19%), linear-gradient(180deg, #bfe3f6 0%, #e9f5fb 70%, #cde8c4 70%); }
.window::before, .window::after { content: ""; position: absolute; background: #fff; }
.window::before { left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; }
.window::after { top: 50%; left: 0; right: 0; height: 4px; margin-top: -2px; }
/* The room follows the clock */
.scene.t-noon .window { background: radial-gradient(circle at 50% 18%, #fff6c9 0 12%, #ffe08f 13% 18%, transparent 19%), linear-gradient(180deg, #8fd0f2 0%, #d8f0fb 70%, #cde8c4 70%); }
.scene.t-evening { background: linear-gradient(180deg, #f9e6cf 0%, #efcfa8 100%); }
.scene.t-evening .window { background: radial-gradient(circle at 35% 64%, #ffe1ad 0 11%, #ffb36b 12% 17%, transparent 18%), linear-gradient(180deg, #f39f7c 0%, #fbd3a1 66%, #b9c99a 66%); box-shadow: 0 0 0 1.5px #d9c3a6, 0 0 60px 10px rgba(255, 170, 110, .45); }
.scene.t-night { background: linear-gradient(180deg, #e6d8c3 0%, #d6bf9e 100%); }
.scene.t-night .window { background: radial-gradient(circle at 68% 30%, #fffbe6 0 10%, transparent 11%), radial-gradient(circle at 24% 22%, #fff 0 2%, transparent 3%), radial-gradient(circle at 42% 52%, #fff 0 1.6%, transparent 2.4%), radial-gradient(circle at 80% 58%, #fff 0 1.4%, transparent 2.2%), linear-gradient(180deg, #1f2a4a 0%, #3b4a78 68%, #2c3a5e 68%); box-shadow: 0 0 0 1.5px #c9b391, 0 0 50px 6px rgba(120, 140, 200, .35); }
.calendar { position: absolute; top: 16%; left: 9%; width: 46px; background: #fff; border-radius: 4px; box-shadow: 0 2px 0 #e4d3bd; text-align: center; font-size: .62rem; line-height: 1.2; color: var(--ink-soft); padding-bottom: 4px; }
.calendar b { display: block; background: var(--accent); color: #fff; font-weight: 500; border-radius: 4px 4px 0 0; padding: 2px 0; font-size: .58rem; }
.calendar span { display: block; font-size: 1.15rem; color: var(--ink); font-weight: 500; }
.plant { position: absolute; left: 6%; bottom: 14%; width: 17%; max-width: 70px; }
.glow { position: absolute; left: 50%; bottom: 10%; width: 62%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, var(--mood) 0 55%, transparent 70%); transition: background .6s; }
.grandma { position: absolute; left: 50%; bottom: 6%; height: 88%; transform: translateX(-50%); z-index: 1; }
.grandma svg { height: 100%; width: auto; display: block; overflow: visible; }
.grandma.swap svg { animation: swap .5s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes swap { from { transform: scale(.9) translateY(8px); opacity: .3; } to { transform: none; opacity: 1; } }
.hearts { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.heart { position: absolute; width: 20px; height: 20px; animation: float 1.9s ease-out forwards; }
@keyframes float { from { opacity: 0; transform: translateY(0) scale(.6); } 15% { opacity: 1; } to { opacity: 0; transform: translateY(-150px) scale(1.1); } }

/* Chat */
.log { flex: 1; min-height: 0; overflow-y: auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }
.day-chip { align-self: center; font-size: .74rem; color: var(--ink-faint); background: #f4ebdf; border-radius: 999px; padding: .1rem .7rem; margin-bottom: 4px; }
.msg { max-width: 82%; padding: .55rem .9rem; border-radius: 20px; font-size: .98rem; font-weight: 400; overflow-wrap: anywhere; animation: in .3s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg.g { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.u { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 6px; font-weight: 300; }
.msg.quote { font-weight: 500; font-size: 1.05rem; background: #fff6e3; border-color: #f1ddb3; }
.typing { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; border-bottom-left-radius: 6px; padding: .7rem .9rem; display: flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); animation: dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

/* Composer */
.composer { flex: none; border-top: 1px solid var(--line); background: var(--cream); padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; }
.replies { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.reply { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; min-height: 40px; padding: 0 .95rem; font-size: .9rem; font-weight: 400; display: inline-flex; align-items: center; gap: .4rem; transition: border-color .2s, transform .1s; }
.reply:hover { border-color: #cdb9a4; }
.reply:active { transform: scale(.97); }
.reply .dot { width: 10px; height: 10px; border-radius: 50%; }
.reply.main { background: var(--ink); color: #fff; border-color: var(--ink); }
.inputrow { display: flex; gap: 8px; align-items: center; }
.inputrow input { flex: 1; min-width: 0; min-height: 46px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); padding: 0 1rem; font: inherit; font-weight: 400; color: var(--ink); }
.inputrow input::placeholder { color: var(--ink-faint); font-weight: 300; }
.send { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; padding: 0; }
.send:disabled { background: var(--line); }
.send svg { width: 20px; height: 20px; }
.hold { position: relative; overflow: hidden; min-height: 58px; border-radius: 999px; border: 0; background: #f1e6d8; font-size: 1rem; font-weight: 400;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: flex; align-items: center; justify-content: center; padding: 0 64px; }
.hold .fill { position: absolute; inset: 0; width: 0; background: var(--accent); border-radius: 999px; }
.hold .label { position: relative; z-index: 1; }
.hold .knob { position: absolute; right: 6px; top: 6px; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; z-index: 2; }
.hold .knob svg { width: 22px; height: 22px; }

/* Share sheet */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(40, 25, 15, .45); }
.sheet-panel { width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; background: var(--cream); border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: .85rem;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 1rem calc(1.25rem + env(safe-area-inset-bottom, 0px)); animation: up .32s cubic-bezier(.2, .8, .2, 1); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { margin: 0; font-size: 1.05rem; font-weight: 500; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: #f1e6d8; display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: #f1e6d8; border-radius: 999px; }
.seg button { border: 0; background: transparent; min-height: 38px; border-radius: 999px; font-size: .88rem; color: var(--ink-soft); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.preview { display: flex; justify-content: center; }
.preview img { width: min(56vw, 220px); aspect-ratio: 9 / 16; max-width: 100%; border-radius: 18px; background: #f1e6d8; box-shadow: 0 18px 40px -18px rgba(60, 35, 20, .5); -webkit-touch-callout: default; transition: opacity .2s; }
.pill { min-height: 54px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font-size: 1rem; font-weight: 400; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: 0 1.4rem; }
.pill svg { width: 20px; height: 20px; }
.how-title { margin: 0 0 -.4rem; font-size: .85rem; font-weight: 500; }
.how { margin: 0; padding: .85rem 1rem .85rem 2.1rem; background: #f4ebdf; border-radius: 18px; font-size: .88rem; color: var(--ink-soft); display: flex; flex-direction: column; gap: .25rem; }
.how b { color: var(--ink); font-weight: 500; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.row2 button { border: 0; background: #f1e6d8; border-radius: 999px; min-height: 44px; font-size: .9rem; }

.toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: .5rem 1.05rem; border-radius: 999px; font-size: .88rem; z-index: 30; max-width: calc(100% - 32px); text-align: center; }

/* Grandma motion */
.gm-body { transform-origin: 100px 240px; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.012, .993); } }
.gm-wave { transform-box: fill-box; transform-origin: 0% 100%; animation: wave 1.6s ease-in-out infinite; }
@keyframes wave { 50% { transform: rotate(-14deg); } }
.gm-pat { transform-box: fill-box; transform-origin: 0% 100%; animation: pat .7s ease-in-out infinite; }
@keyframes pat { 50% { transform: rotate(5deg) translateY(3px); } }
.gm-zzz { animation: zzz 2.6s ease-in-out infinite; }
@keyframes zzz { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
.gm-fan { transform-origin: 148px 92px; animation: fan .5s ease-in-out infinite alternate; }
@keyframes fan { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
.gm-steam { animation: steam 2.4s ease-in-out infinite; }
@keyframes steam { 0%, 100% { opacity: .15; transform: translateY(2px); } 50% { opacity: .7; transform: translateY(-3px); } }
.gm-spark { transform-box: fill-box; transform-origin: center; animation: spark 1.4s ease-in-out infinite; }
@keyframes spark { 50% { transform: scale(.55); opacity: .5; } }
.gm-blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.15); } }

@media (max-height: 640px) { .scene { height: 190px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .log { scroll-behavior: auto; } }
</style>

</head>
<body>
<div class="stage">
<main class="app">
  <header class="head">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <div class="who"><b>ยายสมศรี</b><small><i></i>อยู่บ้าน</small></div>
    <div class="streak" id="streak">วันแรก</div>
  </header>

  <div class="scene" aria-hidden="true">
    <div class="window"></div>
    <div class="calendar"><b id="calMonth">ต.ค.</b><span id="calDay">16</span></div>
    <svg class="plant" viewBox="0 0 60 80"><path d="M30 48 C18 40 10 28 14 16 C24 22 30 34 30 48Z" fill="#7fb07a"/><path d="M30 48 C40 38 48 26 44 12 C34 20 30 34 30 48Z" fill="#6aa067"/><path d="M30 50 C26 36 28 22 32 8 C36 22 34 36 30 50Z" fill="#8fc189"/><path d="M16 48 H44 L40 76 H20 Z" fill="#c8643b"/><path d="M14 46 H46 V52 H14Z" fill="#b5552f"/></svg>
    <div class="glow"></div>

    </form>
  </div>
</main>
</div>

<!-- Share sheet -->
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 id="sheetTitle">ส่งคำยายลงสตอรี่</h2>
      <button class="icon-btn" id="closeSheet" type="button" aria-label="ปิด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="seg" role="group" aria-label="แชร์ไปที่">
      <button type="button" data-platform="ig" aria-pressed="true">Instagram</button>
      <button type="button" data-platform="tiktok" aria-pressed="false">TikTok</button>
      <button type="button" data-platform="fb" aria-pressed="false">Facebook</button>
    </div>
    <div class="seg" id="tiktokFormat" role="group" aria-label="ลง TikTok แบบไหน" hidden>
      <button type="button" data-format="story" aria-pressed="true">สตอรี่</button>
      <button type="button" data-format="post" aria-pressed="false">โพสต์</button>
    </div>
    <div class="preview"><img id="storyImg" alt="การ์ดสตอรี่คำยายพร้อม QR code"></div>
    <button class="pill" id="nativeShare" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/></svg>
      <span id="nativeLabel">แชร์ไปที่ Instagram Stories</span>

    <p class="how-title">หรือแชร์เองใน 4 ขั้น</p>
    <ol class="how" id="how"></ol>
    <div class="row2">
      <button id="copyImg" type="button">คัดลอกรูป</button>
      <button id="copyText" type="button">คัดลอกแคปชัน</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// Link encoded in the QR code and captions: the public website
const APP_URL = "https://yai-somsri.vercel.app/";

/* ---------- Feelings: what you say, what grandma wears, how she stands, what she says ---------- */
const MOODS = {

      "จำความรู้สึกดี ๆ วันนี้ไว้นะ วันไหนเหนื่อยจะได้หยิบมาใช้",

/* ---------- State ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("sc:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("sc:" + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const now = new Date();
const dayKey = d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
const today = dayKey(now);
const dayNum = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 864e5) + now.getFullYear() * 366;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

$("calDay").textContent = now.getDate();
$("calMonth").textContent = now.toLocaleDateString("th-TH", { month: "short" });
let visits = store.get("visits", []);
if (!visits.includes(today)) { visits.push(today); visits = visits.slice(-60); store.set("visits", visits); }
let streak = 0; { const c = new Date(now); while (visits.includes(dayKey(c))) { streak++; c.setDate(c.getDate() - 1); } }
$("streak").innerHTML = streak > 1 ? `มาหายาย <b>${streak}</b> วันติด` : "เช้าแรกที่บ้านยาย";

let data = (() => { const d = store.get("chat", {}); return d.day === today ? d : { day: today, log: [] }; })();
if (data.mood && !MOODS[data.mood]) delete data.mood;
// Grandma's memory of past days: how you felt, what you promised, what she did for you, what you talked about
const keyDate = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
let diary = store.get("diary", {});
const save = () => {
  data.log = data.log.slice(-60); store.set("chat", data);
  diary[today] = { mood: data.mood || null, promise: data.promise || null, done: !!data.done, care: data.care || null, topics: data.topics || [], hugged: !!data.hugged };
  const keep = Object.keys(diary).sort((a, b) => keyDate(b) - keyDate(a)).slice(0, 21);
  diary = Object.fromEntries(keep.map(k => [k, diary[k]])); store.set("diary", diary);
};
// The most recent day before today that grandma remembers, and how many days ago it was
function lastVisit() {
  const k = Object.keys(diary).filter(k => k !== today).sort((a, b) => keyDate(b) - keyDate(a))[0];
  if (!k) return null;
  return { ...diary[k], gap: Math.round((keyDate(today) - keyDate(k)) / 864e5) };
}
const M = () => MOODS[data.mood] || null;

/* ---------- Chat ---------- */
function bubble(m) {

function add(who, text, extra = {}) { const m = { who, text, at: Date.now(), ...extra }; data.log.push(m); data.lastAt = m.at; save(); bubble(m); }
let busy = false;

  const t = document.createElement("div"); t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
  $("log").appendChild(t); $("log").scrollTop = $("log").scrollHeight;
  await wait(reduced ? 200 : Math.min(1600, 450 + text.length * 16));

}
const user = text => add("u", text);

/* Quick replies for each step of the morning */
function setStep(step) { data.step = step; save(); renderReplies(); }
function chip(label, fn, opts = {}) {
  const b = document.createElement("button"); b.type = "button"; b.className = "reply" + (opts.main ? " main" : "");
  if (opts.dot) b.innerHTML = `<span class="dot" style="background:${opts.dot}"></span>`;
  b.append(label);
  b.onclick = async () => { if (busy) return; busy = true; $("replies").innerHTML = ""; try { await fn(); } finally { busy = false; renderReplies(); } };
  return b;
}
function renderReplies() {
  const box = $("replies"); box.innerHTML = "";
  if (busy) return;
  const s = data.step;
  if (s === "recall") box.append(chip("ทำได้แล้วยาย", () => answerRecall(true), { main: true }), chip("ยังไม่ได้เลย", () => answerRecall(false)));
  if (s === "mood") Object.entries(MOODS).forEach(([k, m]) => box.append(chip(m.label, () => pickMood(k), { dot: m.color })));
  if (s === "cheer") {
    box.append(chip("ยายพูดอีกหน่อย", moreWords), chip("ส่งคำยายลงสตอรี่", openShare), chip("ขอบคุณนะยาย", thanks, { main: true }));
  }
  if (s === "promise") {
    (M() ? M().ideas : MOODS.lonely.ideas).forEach(t => box.append(chip(t, () => makePromise(t))));
    box.append(chip("ไว้ค่อยคิดนะยาย", skipPromise));
  }
  if (s === "hug") box.append(holdButton());
  if (s === "done") box.append(chip(care().leave, leave, { main: true }), chip("ส่งคำยายลงสตอรี่", openShare));
  if (s === "after") {
    if (data.promise && !data.done) box.append(chip("ทำตามที่สัญญาแล้วยาย", keptPromise, { main: true }));
    box.append(chip("อยากเล่าให้ยายฟังอีก", askMood), chip("ส่งคำยายลงสตอรี่", openShare));
  }
}

/* Script */
// Pick a line grandma hasn't used lately. Remembers what she said across days; starts over only when every line has been used.
function fresh(key, arr) {
  let used = store.get("used:" + key, []).filter(i => i < arr.length);
  if (used.length >= arr.length) used = used.slice(-1);
  const pool = arr.map((_, i) => i).filter(i => !used.includes(i));
  const i = pool[Math.floor(Math.random() * pool.length)];
  used.push(i); store.set("used:" + key, used);
  return arr[i];
}
// Quotes are remembered by their words in this browser, so a person never gets the same one twice.
// Takes from the first list that still has unseen quotes (the feeling's own words, then the general ones);
// only once every quote has been seen does the one shown longest ago come back.
function freshQuote(...lists) {
  let seen = store.get("seenQuotes", null);
  if (!seen) { // carry over what grandma already said under the old index-based memory
    seen = [];
    const old = [["quotes", QUOTES], ...Object.keys(MOODS).map(k => ["msg-" + k, MOODS[k].msgs])];
    for (const [key, arr] of old) for (const i of store.get("used:" + key, [])) if (arr[i] && !seen.includes(arr[i])) seen.push(arr[i]);
  }
  const has = new Set(seen);
  const pool = lists.find(l => l.some(q => !has.has(q)));
  let q;
  if (pool) { const left = pool.filter(q => !has.has(q)); q = left[Math.floor(Math.random() * left.length)]; }
  else { const all = lists.flat(); q = all.reduce((a, b) => seen.indexOf(b) < seen.indexOf(a) ? b : a); seen = seen.filter(x => x !== q); }
  seen.push(q); store.set("seenQuotes", seen.slice(-1000));
  return q;
}
function todaysQuote() {
  if (!data.dailyQuote) { data.dailyQuote = freshQuote(QUOTES); save(); }
  return data.dailyQuote;
}
async function greet() {
  const h = now.getHours();
  const slot = h < 5 ? "late" : h < 11 ? "morning" : h < 17 ? "noon" : h < 22 ? "evening" : "late";
  busy = true;
  setLook({ outfit: isNight(h) ? "night" : "home", pose: "wave", face: "smile" });
  const pair = fresh("greet-" + slot, LINES[slot]);
  const memory = recallLines(h);
  for (const l of memory.length ? pair.slice(0, 1) : pair) await say(l);
  for (const l of memory) await say(l);
  const last = lastVisit();
  if (last && last.gap === 1 && last.promise && !last.done) {
    data.recallPromise = last.promise; save();
    await say(fresh("recallAsk", RECALL.askPromise).replace("X", last.promise));
    busy = false; setStep("recall");
    return;
  }
  await greetRest();
}
// Up to two things grandma brings up from the last visit
function recallLines(h) {
  const last = lastVisit(), out = [];
  if (!last) return out;
  if (last.gap >= 3) out.push(fresh("missedN", RECALL.missedN).replace("N", last.gap));
  else if (last.gap === 2) out.push(fresh("missed2", RECALL.missed2));
  else {
    if (last.topics && last.topics.length && TOPICS[last.topics[0]]) out.push(fresh("tomorrow-" + last.topics[0], TOPICS[last.topics[0]].tomorrow));
    if (last.mood && RECALL.mood[last.mood]) out.push(fresh("recallMood-" + last.mood, RECALL.mood[last.mood]));
    if (h >= 5 && h < 11 && RECALL.care[last.care]) out.push(fresh("recallCare-" + last.care, RECALL.care[last.care]));
    if (last.promise && last.done) out.push(fresh("recallKept", RECALL.kept));
  }
  if (RECALL.streak[streak] && !store.get("streakSaid-" + streak, false)) { store.set("streakSaid-" + streak, true); out.push(RECALL.streak[streak]); }
  return out.slice(0, 2);
}
async function answerRecall(yes, typed) {
  if (!typed) user(yes ? "ทำได้แล้วยาย" : "ยังไม่ได้เลย");
  if (yes) { setLook({ pose: "cheer", face: "smile" }); hearts(); }
  await say(fresh(yes ? "promiseYes" : "promiseNo", yes ? RECALL.promiseYes : RECALL.promiseNo));
  delete data.recallPromise; save();
  await greetRest();
}
async function greetRest() {
  setLook({ pose: "rest", face: "gentle" });
  await say(fresh("quoteIntro", LINES.quoteIntro));
  data.quote = todaysQuote(); save();
  await say("“" + data.quote + "”", { quote: true });
  await say(fresh("askMood", LINES.askMood));
  busy = false; setStep("mood");
}
async function askMood() { user("อยากเล่าให้ยายฟังอีก"); await say(fresh("askAgain", LINES.askAgain)); data.step = "mood"; save(); }
async function pickMood(k, typed) {
  if (!typed) user(MOODS[k].say);
  data.mood = k; save();
  setLook(moodLook());
  await say(fresh("react-" + k, MOODS[k].react));
  data.quote = freshQuote(MOODS[k].msgs, QUOTES); save();
  await say(data.quote, { quote: true });
  data.step = "cheer"; save();
}
async function moreWords() {
  user("ยายพูดอีกหน่อย");

}
async function thanks() {

  const night = isNight(new Date().getHours());

  data.step = "promise"; save();
}
const care = () => CARE[data.care] || CARE[careAt(new Date().getHours())];
const careLook = which => ({ outfit: moodLook().outfit, ...care()[which] });
async function makePromise(t, typed) {
  if (!typed) user((isNight(new Date().getHours()) ? "พรุ่งนี้จะ" : "วันนี้จะ") + t);
  data.promise = t; data.done = false; save();
  await say(fresh("promiseOk", LINES.promiseOk));

}
async function skipPromise() { user("ไว้ค่อยคิดนะยาย"); await say(fresh("skip", LINES.skip)); await toHug(); }
async function toHug() {
  data.care = careAt(new Date().getHours()); save();
  const c = care();

}

  data.hugged = true; save();
  setLook(careLook("act")); hearts(c.burst);
  await say(fresh("done-" + data.care, c.done));
  await say(fresh("sendOff-" + data.care, c.sendOff) + (data.promise ? ` แล้วอย่าลืม${data.promise}ล่ะ` : ""));
  data.step = "done"; save();
}
async function leave() {

  setLook(isNight(new Date().getHours()) ? { ...c.ready, pose: "rest", face: "gentle" } : { pose: "wave", face: "smile" });
  await say(fresh("bye-" + data.care, c.bye));
  data.step = "after"; save();
}

  user("ทำตามที่สัญญาแล้วยาย");
  data.done = true; save();
  setLook({ outfit: "floral", pose: "cheer", face: "smile" }); hearts();
  await say(fresh("kept", LINES.kept));
}

/* Hold to hug */
function holdButton() {
  const b = document.createElement("button");
  b.type = "button"; b.className = "hold"; b.setAttribute("aria-label", care().hold);
  b.innerHTML = `<span class="fill"></span><span class="label">${care().hold}</span><span class="knob" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span>`;
  const fill = b.querySelector(".fill"); let start = 0, raf = 0, done = false;
  const tick = () => {
    const p = Math.min(1, (performance.now() - start) / 1300); fill.style.width = p * 100 + "%";
    if (p >= 1 && !done) { done = true; busy = true; $("replies").innerHTML = ""; hugged().finally(() => { busy = false; renderReplies(); }); return; }
    raf = requestAnimationFrame(tick);
  };
  const begin = e => { if (e) e.preventDefault(); if (done) return; cancelAnimationFrame(raf); start = performance.now(); raf = requestAnimationFrame(tick); };
  const end = () => { cancelAnimationFrame(raf); if (!done) fill.style.width = "0"; };
  b.addEventListener("pointerdown", begin);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, end));
  b.addEventListener("contextmenu", e => e.preventDefault());
  b.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !e.repeat) { e.preventDefault(); begin(); } });
  b.addEventListener("keyup", e => { if (e.key === "Enter" || e.key === " ") end(); });
  return b;
}

  sad: /เศร้า|เสียใจ|ร้องไห้|ผิดหวัง|อกหัก|น้ำตา|ใจสลาย|ท้อ|หดหู่|ไม่มีความสุข|เฟล/,
  lonely: /เหงา|คนเดียว|คิดถึง|ไม่มีใคร|โดดเดี่ยว|ไม่มีเพื่อน|ห่างบ้าน/,
  worried: /กังวล|เครียด|กลัว|ไม่สบายใจ|ตื่นเต้น|กดดัน|ไม่มั่นใจ|กลุ้ม|สอบ|สัมภาษณ์|ห่วง/,
  cranky: /โกรธ|หงุดหงิด|โมโห|รำคาญ|หัวร้อน|เซ็ง|เบื่อ|ฉุน|ของขึ้น|น่าโมโห/,
  happy: /ดีใจ|มีความสุข|ใจฟู|สนุก|แฮปปี้|สดใส|สุขใจ|สำเร็จ|ผ่านแล้ว|โชคดี|เย้/
};
const CRISIS = /อยากตาย|ฆ่าตัวตาย|ทำร้ายตัวเอง|ไม่อยากอยู่/;
const detectMood = t => Object.keys(KEYWORDS).find(k => KEYWORDS[k].test(t)) || null;

async function send(text) {
  user(text);
  if (CRISIS.test(text)) {
    setLook({ pose: "open", face: "soothe" });
    await say("ยายเป็นห่วงหลานมากนะ ตอนนี้อย่าอยู่คนเดียว โทรหาคนที่ไว้ใจ หรือโทรสายด่วนสุขภาพจิต 1323 ได้ตลอด 24 ชั่วโมง ถ้าฉุกเฉินโทร 1669 นะลูก");
    return;
  }
  if (data.step === "recall") return answerRecall(/ได้|ทำแล้ว|เรียบร้อย|เสร็จ/.test(text) && !/ไม่ได้|ยังไม่/.test(text), true);
  if (data.step === "promise") return makePromise(text.replace(/^(วันนี้|พรุ่งนี้)(จะ)?/, "").trim() || text, true);
  // Remember what the talk was about, so grandma can ask about it tomorrow
  const topics = findTopics(text);
  if (topics.length) { data.topics = [...new Set([...(data.topics || []), ...topics])].slice(-5); save(); }
  const intent = INTENTS.find(i => i.re.test(text));
  if (intent) {
    if (intent.hearts) hearts();
    await say(fresh("intent-" + INTENTS.indexOf(intent), intent.say));
    return;
  }
  const mood = detectMood(text);
  if (mood && !topics.length) return pickMood(mood, true);
  if (mood) { data.mood = mood; save(); setLook(moodLook()); if (data.step === "mood") { data.step = "cheer"; save(); } }
  await say(topics.length ? fresh("topic-" + topics[0], TOPICS[topics[0]].say)
    : TROUBLE.test(text) ? fresh("comfort", LINES.comfort) : fresh("listen", LINES.listen));
  if (Math.random() < 0.4) await say(fresh("follow", FOLLOW));
}
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("text").value.trim(); if (!v || busy) return;
  $("text").value = ""; busy = true; renderReplies();
  try { await send(v); } finally { busy = false; renderReplies(); }
});

/* ---------- Story card (1080 × 1920) ---------- */
// Words that must not end a line (ความ|สุข) and endings that must not start one (|นะลูก)
const GLUE_NEXT = new Set(["ความ", "การ", "น่า", "ไม่"]);
const GLUE_PREV = new Set(["นะ", "จ้ะ", "จ้า", "ลูก", "เลย", "ด้วย", "หรอก", "แล้ว", "กัน", "ค่ะ", "ครับ"]);
function thaiWords(text) {
  if (!(window.Intl && Intl.Segmenter)) return Array.from(text);
  const out = [];
  for (const { segment: s } of new Intl.Segmenter("th", { granularity: "word" }).segment(text)) {
    const prev = out[out.length - 1];
    if (prev && (GLUE_NEXT.has(prev.trim()) || GLUE_PREV.has(s.trim()))) out[out.length - 1] = prev + s; else out.push(s);
  }
  return out;
}
// Thai has no spaces between words, but a space marks a phrase break: keep phrases whole, split a phrase only if it alone is too wide
function wrapLines(ctx, text, maxW) {
  const lines = []; let line = "";
  const tokens = text.split(/(?<= )/).flatMap(p => ctx.measureText(p.trim()).width > maxW ? thaiWords(p) : [p]);
  for (const w of tokens) {
    const test = line + w;
    if (ctx.measureText(test).width > maxW && line.trim()) { lines.push(line.trim()); line = w.trimStart(); } else line = test;
  }
  if (line.trim()) lines.push(line.trim());
  return lines;
}
// Same line count, but as narrow as possible so the lines come out even instead of one long line and a short tail
function balancedLines(ctx, text, maxW) {
  const lines = wrapLines(ctx, text, maxW);
  if (lines.length < 2) return lines;
  let lo = maxW / 2, hi = maxW;
  while (hi - lo > 4) { const mid = (lo + hi) / 2; if (wrapLines(ctx, text, mid).length === lines.length) hi = mid; else lo = mid; }
  return wrapLines(ctx, text, hi);
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function loadSVG(svg) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }); }
const currentQuote = () => data.quote || todaysQuote();

async function makeStory(text, platform) {
  try { await Promise.all(["300 40px Kanit", "400 60px Kanit", "500 80px Kanit"].map(f => document.fonts.load(f))); } catch (e) {}
  const P = PLATFORMS[platform], W = 1080, H = P.h || 1920, F = '"Kanit", "Sukhumvit Set", sans-serif';
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d"), m = M();
  const X = P.left || 90, right = W - P.right, cx = (X + right) / 2, maxW = right - X;

  // Wall, window light, floor
  const wall = ctx.createLinearGradient(0, 0, 0, H); wall.addColorStop(0, "#fbf1e2"); wall.addColorStop(1, "#f1dcbf");
  ctx.fillStyle = wall; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W - 220, P.top + 120, 0, W - 220, P.top + 120, 520);
  glow.addColorStop(0, "rgba(255,226,150,.75)"); glow.addColorStop(1, "rgba(255,226,150,0)"); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  const floorY = H - P.bottom - (P.floor || 380);
  ctx.fillStyle = "#d9b48a"; ctx.fillRect(0, floorY, W, H - floorY);
  ctx.fillStyle = "#c39566"; ctx.fillRect(0, floorY, W, 8);
  ctx.fillStyle = "rgba(0,0,0,.05)"; for (let x = 0; x < W; x += 150) ctx.fillRect(x, floorY + 8, 4, H);

  // Eyebrow
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.font = `400 38px ${F}`; ctx.fillStyle = "#7b6a60";
  ctx.fillText(m ? `ยายสมศรีฝากมา ตอนหลาน${m.label}` : "ยายสมศรีฝากมาบอก", cx, P.top + 60);

  // Grandma standing on the floor
  // Leave the speech bubble at least ~300px; on platforms with a tall top bar (TikTok) grandma shrinks a little instead
  // On a post she stands to the right, beside the QR panel
  const GH = Math.max(480, Math.min(640, floorY + 120 - (P.top + 100) - 30 - (P.post ? 420 : 300))), GW = GH * 200 / 250, gTop = floorY + 120 - GH;
  const gx = P.post ? right - GW / 2 : cx;
  const gm = m ? { outfit: m.outfit, pose: m.pose, face: m.face } : { outfit: "home", pose: "hug", face: "gentle" };
  ctx.fillStyle = m ? m.glow : "#f6e1c8"; ctx.beginPath(); ctx.arc(gx, gTop + GH * .45, GW * .55, 0, Math.PI * 2); ctx.fill();
  try { const img = await loadSVG(grandmaSVG(gm, false)); ctx.drawImage(img, gx - GW / 2, gTop, GW, GH); } catch (e) {}

  // Speech bubble with the quote
  const bTop = P.top + 100, bBottom = gTop - 30, bw = maxW, bx = X;
  let size = P.post ? 84 : 76, lines;
  do { ctx.font = `500 ${size}px ${F}`; lines = balancedLines(ctx, text, bw - 120); size -= 4; } while (lines.length * size * 1.45 + 120 > bBottom - bTop && size > 44);
  size += 4; const lh = size * 1.45, bh = Math.min(bBottom - bTop, lines.length * lh + 110), by = bTop + (bBottom - bTop - bh) / 2;
  ctx.save(); ctx.shadowColor = "rgba(80,50,30,.14)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
  roundRect(ctx, bx, by, bw, bh, 56); ctx.fillStyle = "#ffffff"; ctx.fill();
  ctx.beginPath(); ctx.moveTo(gx - 34, by + bh - 2); ctx.lineTo(gx, by + bh + 46); ctx.lineTo(gx + 34, by + bh - 2); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.font = `500 ${size}px ${F}`; ctx.fillStyle = "#33251f";
  lines.forEach((l, i) => ctx.fillText(l, cx, by + 55 + size * .95 + i * lh));

  // QR panel
  ctx.textAlign = "left";
  const ph = 180, pw = P.post ? 470 : Math.min(maxW, 560), px = P.post ? X : cx - pw / 2, py = H - P.bottom - ph;
  ctx.save(); ctx.shadowColor = "rgba(80,50,30,.18)"; ctx.shadowBlur = 36; ctx.shadowOffsetY = 10;
  roundRect(ctx, px, py, pw, ph, 44); ctx.fillStyle = "#fffaf2"; ctx.fill(); ctx.restore();
  const qs = 136, qx = px + 22, qy = py + (ph - qs) / 2;
  if (window.qrcode) {
    const qr = qrcode(0, "M"); qr.addData(APP_URL); qr.make();
    const n = qr.getModuleCount(), cell = qs / n; ctx.fillStyle = "#33251f";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(qx + c * cell, qy + r * cell, Math.ceil(cell), Math.ceil(cell));
  }
  const tx = qx + qs + 28;
  ctx.fillStyle = "#33251f"; ctx.font = `500 38px ${F}`; ctx.fillText("คุยกับยายสมศรี", tx, py + 76);
  ctx.font = `300 28px ${F}`; ctx.fillStyle = "#7b6a60";
  ctx.fillText("สแกนให้ยายกอด", tx, py + 118);
  ctx.fillText("ได้ทุกเช้านะลูก", tx, py + 154);
  return cv.toDataURL("image/png");
}

/* ---------- Share sheet ---------- */
let storyURL = null, lastFocus = null, platform = PLATFORMS[store.get("platform", "ig")] ? store.get("platform", "ig") : "ig";
let tiktokFormat = store.get("tiktokFormat", "story") === "post" ? "post" : "story";
const cardKey = () => platform === "tiktok" && tiktokFormat === "post" ? "tiktokPost" : platform;
const caption = () => currentQuote() + "\n\nมาคุยกับยายสมศรีได้ทุกเช้าที่ " + APP_URL + "\n#ยายสมศรี #คำยาย #กำลังใจ";
async function renderStory() {
  const key = cardKey(), P = PLATFORMS[key];
  document.querySelectorAll("[data-platform]").forEach(b => b.setAttribute("aria-pressed", b.dataset.platform === platform));
  $("tiktokFormat").hidden = platform !== "tiktok";
  document.querySelectorAll("[data-format]").forEach(b => b.setAttribute("aria-pressed", b.dataset.format === tiktokFormat));
  $("sheetTitle").textContent = P.post ? "ส่งคำยายลงโพสต์" : "ส่งคำยายลงสตอรี่";
  $("storyImg").style.aspectRatio = `1080 / ${P.h || 1920}`;
  $("storyImg").alt = P.post ? "การ์ดโพสต์คำยายพร้อม QR code" : "การ์ดสตอรี่คำยายพร้อม QR code";
  $("nativeLabel").textContent = "แชร์ไปที่ " + P.name;
  $("how").innerHTML = P.steps.map(s => "<li>" + s + "</li>").join("");
  $("storyImg").style.opacity = ".35";
  storyURL = await makeStory(currentQuote(), key);
  $("storyImg").src = storyURL; $("storyImg").style.opacity = "";
}
async function openShare() {
  lastFocus = document.activeElement; $("storyImg").removeAttribute("src");
  $("sheet").hidden = false; renderStory(); $("closeSheet").focus();
}
document.querySelectorAll("[data-platform]").forEach(b => b.addEventListener("click", () => { platform = b.dataset.platform; store.set("platform", platform); renderStory(); }));
document.querySelectorAll("[data-format]").forEach(b => b.addEventListener("click", () => { tiktokFormat = b.dataset.format; store.set("tiktokFormat", tiktokFormat); renderStory(); }));
function closeSheet() { $("sheet").hidden = true; if (lastFocus && lastFocus.isConnected) lastFocus.focus(); }
$("closeSheet").addEventListener("click", closeSheet);
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
// Opens the phone's share menu (Instagram / TikTok / Facebook appear there) once the app runs on its own website.
$("nativeShare").addEventListener("click", async () => {
  if (!storyURL) return;
  try {
    const blob = await (await fetch(storyURL)).blob();
    const file = new File([blob], PLATFORMS[cardKey()].post ? "yai-somsri-post.png" : "yai-somsri-story.png", { type: "image/png" });
    if (!navigator.canShare || !navigator.canShare({ files: [file] })) throw new Error("unsupported");
    await navigator.share({ files: [file], text: caption() });
  } catch (e) {
    if (e && e.name === "AbortError") return;
    toast("เปิดเมนูแชร์จากตรงนี้ไม่ได้ ทำตาม 4 ขั้นด้านล่างแทนนะ");
    $("how").scrollIntoView({ behavior: "smooth", block: "center" });
  }
});
$("copyImg").addEventListener("click", () => {
  if (!storyURL || !window.ClipboardItem) { toast("เครื่องนี้คัดลอกรูปไม่ได้ กดค้างที่รูปเพื่อบันทึกแทนนะ"); return; }
  navigator.clipboard.write([new ClipboardItem({ "image/png": fetch(storyURL).then(r => r.blob()) })])
    .then(() => toast("คัดลอกรูปแล้ว"), () => toast("คัดลอกรูปไม่ได้ กดค้างที่รูปเพื่อบันทึกแทนนะ"));
});
$("copyText").addEventListener("click", () => {
  navigator.clipboard.writeText(caption()).then(() => toast("คัดลอกแคปชันแล้ว"), () => toast("คัดลอกไม่ได้ ลองพิมพ์แคปชันเองนะ"));
});

async function welcomeBack(h) {
  const slot = h < 5 ? "late" : h < 11 ? "morning" : h < 17 ? "noon" : h < 22 ? "evening" : "late";
  busy = true;
  setLook({ outfit: isNight(h) ? "night" : moodLook().outfit, pose: "wave", face: "smile" });
  await say(fresh("back", RECALL.back));
  await say(fresh("greet-" + slot, LINES[slot])[0]);
  data.care = null;
  await say(fresh("askAgain", LINES.askAgain));
  busy = false; setStep("mood");
}

/* ---------- Boot ---------- */
(function boot() {
  const h = now.getHours();
  document.querySelector(".scene").classList.add("t-" + (isNight(h) ? "night" : h < 11 ? "morning" : h < 17 ? "noon" : "evening"));
  const chipEl = document.createElement("div"); chipEl.className = "day-chip";
  chipEl.textContent = now.toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "long" });
  $("log").appendChild(chipEl);
  if (data.log.length) {
    data.log.forEach(bubble);
    if (data.step === "hug") setLook(careLook("ready"));
    else if (data.step === "after" || data.step === "done") setLook({ ...moodLook(), pose: "wave", face: "smile" });
    else setLook(M() ? moodLook() : { outfit: "home", pose: "wave", face: "smile" });
    if (!data.step) data.step = "mood";
    const away = data.lastAt ? Date.now() - data.lastAt : 0;
    if (away >= 2 * 3600e3 && ["cheer", "after", "done", "mood"].includes(data.step)) welcomeBack(h);
    else renderReplies();
  } else {
    greet();
  }
})();
